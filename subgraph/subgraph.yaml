specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: TSLARawAggregator
    network: robinhood
    source:
      address: "0x7A6b81ba7FbCB90104d8C496158Cf383cD7233b1"
      startBlock: 54198162
      abi: TSLARawAggregator
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AnswerUpdated
        - NewRound
        - FeedWindow
        - PriceRangeIndex
      abis:
        - name: TSLARawAggregator
          file: ./abis/TSLARawAggregator.json
      eventHandlers:
        - event: AnswerUpdated(indexed int256,indexed uint256,uint256)
          handler: handleAnswerUpdated
        - event: NewRound(indexed uint256,indexed address,uint256)
          handler: handleNewRound
      file: ./src/tsla-raw-aggregator.ts
